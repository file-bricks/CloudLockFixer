name: CloudLockFixer tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
          python -m pip install -r requirements-build.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Compile Python bytecode
        run: python -m compileall -q .

      - name: Run tests
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m pytest -ra -v

      - name: Verify packaging dependencies
        run: python -c "import PyInstaller, PIL; print('packaging dependencies available')"


  tests-linux:
    # Die Suite ist plattformneutral (Windows-spezifische Tests sind gepinnt
    # bzw. übersprungen); dieser Job hält die POSIX-Pfade (pgrep/pkill,
    # Nautilus-Skripte, Symlinks) dauerhaft grün.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip install -r requirements-build.txt

      - name: Run tests
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra -v

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlockfixer"
version = "0.2.3"
description = "Windows tray and CLI tool for delayed rename, move and delete operations in cloud-sync folders"
readme = "README.md"
authors = [
    { name = "file-bricks", email = "info@file-bricks.org" }
]
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
keywords = [
    "windows",
    "cloud-sync",
    "onedrive",
    "cldflt",
    "file-lock",
    "copy-delete",
    "delayed-action",
    "local-first",
    "zero-egress",
    "pyside6",
    "cloud-storage",
    "file-management",
    "python",
    "sync",
    "system-tray",
    "cloud-files",
    "offline-first",
    "privacy-first",
    "windows-tray",
    "open-bricks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Desktop Environment",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
]
test = [
    "pytest>=9.1.1",
]
build = [
    "PyInstaller>=6.0",
    "Pillow>=12.3.0",
]

[project.urls]
Homepage = "https://github.com/file-bricks/CloudLockFixer"
Documentation = "https://github.com/file-bricks/CloudLockFixer#readme"
Repository = "https://github.com/file-bricks/CloudLockFixer.git"
"Bug Tracker" = "https://github.com/file-bricks/CloudLockFixer/issues"
"Changelog" = "https://github.com/file-bricks/CloudLockFixer/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/file-bricks/CloudLockFixer/blob/main/SECURITY.md"
"Parent Org" = "https://github.com/file-bricks"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"LLM Ready" = "https://github.com/file-bricks/CloudLockFixer/blob/main/llms.txt"
"Marketing Log" = "https://github.com/file-bricks/CloudLockFixer/blob/main/MARKETING-LOG.txt"
"Third-Party Licenses" = "https://github.com/file-bricks/CloudLockFixer/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/file-bricks/CloudLockFixer/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/file-bricks/CloudLockFixer/blob/main/THIRD_PARTY_LICENSES.md#level-1-sbom-invariant-cross-reference-matrix"
"Level 1 SBOM (Text)" = "https://github.com/file-bricks/CloudLockFixer/blob/main/THIRD_PARTY_LICENSES.txt"
Contributing = "https://github.com/file-bricks/CloudLockFixer/blob/main/CONTRIBUTING.md"
"Plain-Text License" = "https://github.com/file-bricks/CloudLockFixer/blob/main/LICENSE"
Notice = "https://github.com/file-bricks/CloudLockFixer/blob/main/NOTICE"

[project.scripts]
cloudlockfixer = "cloudlockfixer.cli:main"

# The package version is the source of truth for the current release line.
# The v1.0.0 tag is historical; the current tree remains unreleased until the
# Windows release gate in RELEASE_GATE.md has passed.
[tool.cloudlockfixer.release]
state = "unreleased"
baseline_tag = "v0.2.2"
historical_initial_tag = "v1.0.0"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -v --basetemp=.pytest_temp"
norecursedirs = [".git", ".pytest_cache", ".pytest_temp", "__pycache__", "build", "dist", ".hypothesis", ".turbo", ".nyc_output", ".tox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]


